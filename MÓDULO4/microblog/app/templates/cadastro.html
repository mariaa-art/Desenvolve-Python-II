{% extends "base.html" %}
{% block content %}
    <h2>Crie sua conta</h2>
    <form action="" method="post">
        <div class="form-group">
            <label for="username">Usuário (Obrigatório):</label>
            <input type="text" id="username" name="username" required placeholder="Escolha um nome de usuário">
        </div>
        <div class="form-group">
            <label for="password">Senha (Obrigatório):</label>
            <input type="password" id="password" name="password" required placeholder="Crie uma senha forte">
        </div>
        <div class="form-group">
            <label for="foto">Foto de Perfil (URL Opcional):</label>
            <input type="text" id="foto" name="foto" placeholder="https://exemplo.com/suafoto.jpg">
        </div>
        <div class="form-group">
            <label for="bio">Biografia (Opcional):</label>
            <textarea id="bio" name="bio" rows="3" placeholder="Fale um pouco sobre você..."></textarea>
        </div>
        <div class="form-group">
            <label style="font-weight: normal; cursor: pointer;">
                <input type="checkbox" name="remember"> Lembrar-me após o cadastro
            </label>
        </div>
        <button type="submit">Finalizar Cadastro</button>
    </form>
{% endblock %}
